[package]
name = "da-harness"
version = "0.2.0"
edition = "2024"
description = "A framework for running LLM-driven agent loops with structured JSON request/response schemas"
repository = "https://github.com/da-x/da-harness"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["llm", "agent", "openai", "schema", "loop"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
anyhow = "1"
async-openai = "0.27"
async-trait = "0.1"
derive_builder = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
